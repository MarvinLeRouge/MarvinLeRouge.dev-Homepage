# Production on the VPS (/home/mlr/marvinlerouge.dev/website/compose), deployed by the Build & Deploy workflow.
# No container_name: names derive from the project, so they never collide with the legacy "homepage" container.
name: website

services:
  website:
    image: ghcr.io/marvinlerouge/marvinlerouge.dev-website:${IMAGE_TAG:-latest}
    expose:
      - '80'
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-public'
      - 'traefik.http.routers.website.rule=Host(`marvinlerouge.dev`)'
      # Default priority is the rule length (25 here): 26 wins over the legacy "homepage" router (same rule)
      # while both run, without shadowing longer rules such as path-based routers on this host
      - 'traefik.http.routers.website.priority=26'
      - 'traefik.http.routers.website.entrypoints=websecure'
      - 'traefik.http.routers.website.tls=true'
      - 'traefik.http.routers.website.tls.certresolver=letsencrypt'
      - 'traefik.http.services.website.loadbalancer.server.port=80'
      # www (covered by the *.marvinlerouge.dev DNS record) redirects permanently to the apex, path kept.
      # $$ escapes $ for compose variable interpolation.
      - 'traefik.http.routers.website-www.rule=Host(`www.marvinlerouge.dev`)'
      - 'traefik.http.routers.website-www.entrypoints=websecure'
      - 'traefik.http.routers.website-www.tls=true'
      - 'traefik.http.routers.website-www.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.website-www.middlewares=website-www-redirect'
      - 'traefik.http.routers.website-www.service=website'
      - 'traefik.http.middlewares.website-www-redirect.redirectregex.regex=^https?://www\.marvinlerouge\.dev/(.*)'
      - 'traefik.http.middlewares.website-www-redirect.redirectregex.replacement=https://marvinlerouge.dev/$${1}'
      - 'traefik.http.middlewares.website-www-redirect.redirectregex.permanent=true'
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
