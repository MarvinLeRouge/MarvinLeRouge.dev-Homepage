server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers: behind Traefik the container only sees http on port 80.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    error_page 404 /404.html;

    # Static multi-page site: no SPA fallback, unknown paths are real 404s.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Content-hashed build assets (CSS, fonts, scripts): safe to cache forever.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
