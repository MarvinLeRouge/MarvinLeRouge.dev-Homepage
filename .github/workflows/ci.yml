name: CI

on:
  push:
    branches:
      - main
    # Root-level docs only: project sheets are Markdown under src/content/ and must trigger a deploy.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test:cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: frontend
          files: coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E and accessibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: E2E and accessibility tests
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  links:
    name: Links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Internal links only: external sites (LinkedIn in particular) block bots and would make CI flaky.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            'dist/**/*.html'
          fail: true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=critical

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --target production -t website:ci .
      - name: Start container
        run: |
          docker run -d --name website -p 8080:80 website:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' website)" = healthy ] && exit 0
            sleep 1
          done
          docker logs website
          exit 1
      - name: Smoke test (status codes, headers, caching)
        run: scripts/smoke-docker.sh http://localhost:8080

  ci-status:
    name: CI status
    if: always()
    needs: [lint, test, build, e2e, links, security, docker]
    runs-on: ubuntu-latest
    steps:
      # Skipped counts as a failure: a job skipped by a future condition must not pass the gate silently.
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
